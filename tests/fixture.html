<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Reader · independent test</title>
<link rel="stylesheet" href="/extension/style.css">
<style>
body {margin:0; background:#303b39; color:#eee; font-family:system-ui;}
.host {max-width:850px; margin:70px auto; padding:24px;}
#leftSendForm {display:flex;gap:8px;align-items:center;}
textarea {width:80%;height:70px;}
</style>
<main class="host"><h1>独立测试聊天</h1><p>本页面只使用示例故事，不读取真实用户数据。</p><div id="leftSendForm"></div><textarea id="send_textarea">草稿应保持原样。</textarea><div id="extensions_settings2"></div></main>
<script src="/vendor/showdown.js"></script>
<script src="/vendor/purify.js"></script>
<script>
    window.fixtureEvents = new Map();
    window.fixtureChatId = 'fixture-chat';
    window.fixtureSettings = {};
    window.savedSettings = 0;
    const passages = [
        '雨刚停，街道尽头的书店亮起了一盏暖灯。林舟收起伞，站在屋檐下，听水珠沿着铁皮一滴一滴落进花盆。门上的铜铃被风碰响，店主抬头，朝他笑了一下。',
        '“还没关门？”他问。\n\n“最后一位客人可以慢慢看。”店主把一杯热茶放在靠窗的小桌上，继续整理那摞装订松散的旧书。桌边留着一把椅子，椅面朝着灯。',
        '他没有立刻翻书，只是隔着玻璃看街上的人经过。公交车停在路口，一个孩子举起鞋尖，跨过倒映着招牌的小水洼。明天还会有许多事情要做，此刻却可以先坐一会儿。',
    ];
    window.fixtureChat = [
        {is_user:true,mes:'USER_SENTINEL'},
        ...passages.map((p,i)=>({name:'讲述者',mes:`<think_fox~>HIDDEN_PLAN <content>FALSE_BODY</content></think_fox~><content>${i===0?'## 雨后，书店\n\n':''}${Array(8).fill(p).join('\n\n')}${i===2?'\n\n<img src="https://invalid.example/tracker" onerror="window.readerXss=true"><script>window.readerXss=true<\/script>':''}</content><fox_selc>CHOICE_SENTINEL</fox_selc><StatusBlock>STATE_SENTINEL</StatusBlock>`,extra:{reasoning:'REASONING_SENTINEL'},swipes:['ALTERNATIVE_SENTINEL']})),
        {is_system:true,mes:'SYSTEM_SENTINEL'},
        {name:'讲述者',mes:'UNTAGGED_SENTINEL'},
    ];
    window.fixtureContext = {
        chat:window.fixtureChat,characterId:0,characters:[{name:'雨后书店',avatar:'fixture.png'}],groups:[],name2:'讲述者',
        getCurrentChatId:()=>window.fixtureChatId,
        extensionSettings:window.fixtureSettings,
        saveSettingsDebounced:()=>{window.savedSettings++;},
        eventTypes:Object.fromEntries(['APP_READY','CHAT_CHANGED','CHAT_LOADED','MESSAGE_EDITED','MESSAGE_UPDATED','MESSAGE_DELETED','MESSAGE_SWIPED','MESSAGE_SWIPE_DELETED','GENERATION_ENDED'].map(x=>[x,x])),
        eventSource:{on(name,fn){if(!window.fixtureEvents.has(name))window.fixtureEvents.set(name,[]);window.fixtureEvents.get(name).push(fn);}},
    };
    window.emitFixtureEvent=name=>(window.fixtureEvents.get(name)||[]).forEach(fn=>fn());
    window.SillyTavern={getContext:()=>window.fixtureContext,libs:{showdown:window.showdown,DOMPurify:window.DOMPurify}};
</script>
<script type="module">import { init } from '/extension/index.js'; init(); window.readerReady=true;</script>
</html>
